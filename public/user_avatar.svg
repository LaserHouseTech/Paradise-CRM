<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Vibrant blue radial gradient exactly matching the uploaded user avatar -->
    <radialGradient id="avatarGlow" cx="44%" cy="34%" r="68%" fx="36%" fy="24%">
      <stop offset="0%" stop-color="#00aaff" />
      <stop offset="28%" stop-color="#056fff" />
      <stop offset="62%" stop-color="#1444ec" />
      <stop offset="88%" stop-color="#0e23b8" />
      <stop offset="100%" stop-color="#061280" />
    </radialGradient>
  </defs>

  <!-- Circular background -->
  <circle cx="256" cy="256" r="256" fill="url(#avatarGlow)" />

  <g fill="#FFFFFF">
    <!-- Center ray (vertical) -->
    <rect x="242" y="126" width="28" height="116" rx="14" />

    <!-- Left inner ray (-24°) -->
    <rect x="243" y="130" width="26" height="112" rx="13" transform="rotate(-24 256 248)" />

    <!-- Right inner ray (+24°) -->
    <rect x="243" y="130" width="26" height="112" rx="13" transform="rotate(24 256 248)" />

    <!-- Left outer ray (-48°) -->
