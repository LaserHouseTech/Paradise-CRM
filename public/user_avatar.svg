    <!-- Right outer ray (+48°) -->
    <rect x="244" y="142" width="24" height="104" rx="12" transform="rotate(48 256 248)" />

    <!-- Arched horizontal bar and curving stem -->
    <path d="M 88 280 C 82 278 80 271 85 264 C 95 252 165 244 256 244 C 347 244 417 252 427 264 C 432 271 430 278 424 280 C 405 280 345 268 280 268 C 271 268 266 274 264 282 C 258 316 268 360 292 388 C 295 392 293 398 287 400 L 270 402 C 263 402 258 398 254 391 C 236 360 228 320 234 284 C 236 274 230 268 220 268 C 165 268 108 280 88 280 Z" />
  </g>
</svg>
